name: Validate Uphill Sliding release metadata

"on":
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    if: github.repository == 'kellykiller/Uphill-Sliding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check ficsit version metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plugin = json.loads(Path('UphillSliding.uplugin').read_text())
          assert plugin['SemVersion'] == plugin['VersionName'] == '1.1.0'
          assert plugin['Version'] == int(plugin['SemVersion'].split('.')[0])
          assert plugin['RequiredOnRemote'] is True
          assert plugin['IsBetaVersion'] is plugin['IsExperimentalVersion'] is False
          PY
